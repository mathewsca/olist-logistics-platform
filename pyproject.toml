[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-platform"
dynamic = ["version"]
description = "Fullstack data platform for e-commerce logistics built on the Olist public dataset."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mathews Carvalho" }]
dependencies = []

[project.optional-dependencies]
# Each block adds its own extra (ingestion, dbt, ml, api, dashboard, monitoring),
# so CI and each Docker image install only what they need.
ingestion = [
    "kaggle>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]
# dbt v2 (Rust engine) has no Postgres adapter yet, so the project stays on dbt Core 1.x.
dbt = [
    "dbt-core>=1.10,<2",
    "dbt-postgres>=1.9,<2",
    "python-dotenv>=1.0",
]
# Also used by `make analyses` and `make extract`; altair and pydeck come with streamlit.
dashboard = [
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "streamlit>=1.51",
]
# Training and evaluation; the API image reuses the features module with a subset of these.
ml = [
    "lightgbm>=4.5",
    "mlflow>=3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "shap>=0.46",
]
# Inference image: loads the exported champions with mlflow-skinny, no training stack.
# `make export-model` reads the warehouse from the host venv (ml extra), so no psycopg here.
api = [
    "fastapi>=0.115",
    "lightgbm>=4.5",
    "mlflow-skinny>=3.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "skops>=0.10",
    "uvicorn>=0.30",
]
# Drift and performance monitoring + the retraining simulation; training deps come from ml.
monitoring = [
    "evidently>=0.7,<0.8",
    "olist-platform[ml]",
    # Evidently 0.7 imports a private pandas helper that pandas 3 removed.
    "pandas>=2.2,<4",
]
dev = [
    # FastAPI's TestClient; recent Starlette prefers httpx2 but still accepts httpx.
    "httpx>=0.27",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
]

[project.urls]
Repository = "https://github.com/mathewsca/olist-logistics-platform"

[tool.setuptools.dynamic]
version = { attr = "olist_platform.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["dbt/target", "dbt/dbt_packages", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

# Typographic signs used on purpose in the Portuguese texts of the dashboard and reports.
allowed-confusables = ["×", "–", "−"]

[tool.ruff.lint.isort]
known-first-party = ["olist_platform"]

[tool.coverage.run]
source = ["olist_platform"]
# CLI wrappers and the subprocess launcher are exercised by the integration tests and the DAGs.
omit = ["*/__main__.py"]

[tool.coverage.report]
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: tests that need the docker compose services running (run with: make test-integration)",
]
