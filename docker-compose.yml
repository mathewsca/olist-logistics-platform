name: olist

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: olist-airflow:local
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Every component must share the JWT secret, or task runs cannot authenticate to the API server.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-jwt-secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    # The api-server's first request after a cold start took ~42s; the 5s default failed the first task
    # and its retries then got 400 because the original call had already marked the task as running.
    AIRFLOW__WORKERS__EXECUTION_API_TIMEOUT: "60"
    # Local-only stack: no login screen. Never expose this setup outside localhost.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Mounted src/ shadows the copy baked into the image, so code edits apply without a rebuild.
    PYTHONPATH: /opt/airflow/src
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: "5432"
    OLIST_LANDING_DIR: /opt/airflow/data/landing
    DBT_EXECUTABLE: /opt/dbt-venv/bin/dbt
    DBT_PROJECT_DIR: /opt/airflow/dbt
    # Keep the container's dbt artifacts apart from the host's (paths and partial parsing differ).
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    OLIST_ML_PYTHON: /opt/ml-venv/bin/python
    # Monitoring steps run from here, so report paths are the same as on the host.
    OLIST_PROJECT_DIR: /opt/airflow
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./dbt:/opt/airflow/dbt
    - ./reports:/opt/airflow/reports
    - ./docs:/opt/airflow/docs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB}
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
    ports:
      - "${WAREHOUSE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      # The Airflow CLI takes ~12s to start on Docker Desktop, so the default 10s timeout flaps.
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Tracking server + model registry. SQLite is enough for one local user; artifacts are served
  # by the server, so `make train` on the host and containers read them the same way.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      # Host header check: the host reaches it as localhost, other services as mlflow.
      - --allowed-hosts=localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Optional (profile): `make dashboard-docker`. `make dashboard` runs the same app from the venv.
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: olist-dashboard:local
    profiles: [dashboard]
    env_file: .env
    environment:
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      DASHBOARD_SOURCE: postgres
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional (profile): `make api-docker`. Pulls the current champions from MLflow at startup and
  # falls back to the bundle baked into the image (`make export-model`) if MLflow is down.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: olist-api:local
    profiles: [api]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
        # Waits for a healthy MLflow when there is one, but still starts (on the bundle) without it.
        required: false
    restart: unless-stopped

volumes:
  postgres-data:
  mlflow-data:
