version: 2

models:
  - name: dim_date
    description: Calendar from calendar_start to calendar_end (vars), one row per day.
    columns:
      - name: date_day
        description: Calendar day; the key every fact date column points to.
        data_tests: [unique, not_null]
      - name: year_month
        description: Month label (YYYY-MM), the grain used by monthly SLA analyses.
      - name: iso_day_of_week
        description: 1 = Monday ... 7 = Sunday.

  - name: dim_geography
    description: One point per zip code prefix (median of the source points inside Brazil).
    columns:
      - name: zip_code_prefix
        description: First five digits of the zip code.
        data_tests: [unique, not_null]
      - name: region
        description: IBGE macro-region of the state.
        data_tests:
          - accepted_values:
              arguments:
                values: &regions [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]

  - name: dim_customers
    description: >
      Customers. Grain is customer_id (one per order, as generated by Olist);
      customer_unique_id identifies the person.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: customer_zip_code_prefix
        description: Some prefixes have no geolocation in the source (counted by the warning test).
        data_tests:
          - relationships:
              # Fixed name: the audit table and the data_issues seed refer to it.
              name: customer_zip_code_has_geolocation
              arguments:
                to: ref('dim_geography')
                field: zip_code_prefix
              config:
                severity: warn
      - name: customer_region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: *regions

  - name: dim_sellers
    description: Sellers with location and region.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
      - name: seller_zip_code_prefix
        description: Some prefixes have no geolocation in the source (counted by the warning test).
        data_tests:
          - relationships:
              name: seller_zip_code_has_geolocation
              arguments:
                to: ref('dim_geography')
                field: zip_code_prefix
              config:
                severity: warn
      - name: seller_region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: *regions

  - name: dim_products
    description: Products with the category in English (Portuguese when untranslated) and volume.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: product_category
        description: Category in English; null when the source has no category.
      - name: product_volume_cm3
        description: Length x height x width.

  - name: fct_order_items
    description: One row per order item, with the order context and the item value.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: purchase_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: total_value
        description: price + freight_value.

  - name: fct_orders
    description: >
      One row per order (every status), with item, payment and latest-review summaries.
      Orders without items (mostly canceled or unavailable) keep item_count = 0.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_olist__orders')
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: customer_unique_id
        data_tests: [not_null]
      - name: purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: main_seller_id
        description: Seller of the most expensive item; the origin of the order route.
      - name: main_payment_type
        description: Payment type with the highest value in the order.
      - name: review_score
        description: Score of the most recent review (null when the order has no review).
      - name: review_count
        description: Number of reviews of the order (a few orders have more than one).
      - name: has_review_comment
        description: The most recent review has a written message (null when the order has no review).
      - name: review_mentions_delivery
        description: >
          The comment of the most recent review mentions delivery (stems such as entreg, prazo,
          atras, cheg, correio); null without a comment. Known after the purchase: analysis only.

  - name: fct_deliveries
    description: >
      One row per delivered order with a delivery date. Origin is the main seller (seller of
      the most expensive item); multi-seller orders are flagged with is_multi_seller.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_late = (delay_days > 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_same_state = (origin_state = destination_state)"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: purchase_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: delivery_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: estimated_delivery_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: delivery_days
        description: Purchase to delivery, in fractional days.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: estimated_delivery_days
        description: Calendar days from the purchase date to the promised date (known at purchase).
        data_tests: [not_null]
      - name: delay_days
        description: Delivery date minus promised date; positive means late, negative means early.
        data_tests: [not_null]
      - name: is_late
        description: Delivered after the promised calendar date. Target of the classification model.
        data_tests: [not_null]
      - name: seller_handling_days
        description: Purchase to carrier hand-off, in fractional days (null when the source has no hand-off).
      - name: carrier_transit_days
        description: Carrier hand-off to delivery, in fractional days.
      - name: distance_km
        description: Great-circle distance seller to customer (null when a zip prefix has no geolocation).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5000
      - name: is_same_state
        description: Seller and customer in the same state.
