seeds:
  - name: data_issues
    description: >
      Known anomalies of the source, one row per dbt test that counts them (severity warn), with
      the treatment applied. The violations live in audit.<test_name>.
    columns:
      - name: test_name
        description: Name of the dbt test, and of its table in the audit schema.
        data_tests: [unique, not_null]
      - name: model
        description: Model the test reads.
        data_tests: [not_null]
      - name: issue
        description: What is wrong in the source (Portuguese, shown in the dashboard).
        data_tests: [not_null]
      - name: treatment
        description: What the pipeline does about it (Portuguese).
        data_tests: [not_null]
